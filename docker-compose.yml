services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # override the hosts so the container talks to the other services, not 127.0.0.1
      DB_URL: mongodb://mongo:27017/Sahi?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  # A single-node replica set: the API uses transactions (creating an organization and its owner, changing a
  # password), and MongoDB only allows transactions on a replica set.
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db   # keeps your data when the container restarts
    healthcheck:
      # Initiates the replica set on the first start, then just reports whether it's up
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  mongo-data:
