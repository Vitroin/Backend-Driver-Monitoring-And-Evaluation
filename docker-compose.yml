services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # override the hosts so the container talks to the other services, not 127.0.0.1
      DB_URL: mongodb://mongo:27017/Sahi
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db   # keeps your data when the container restarts

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  mongo-data: